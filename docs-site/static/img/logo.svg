<svg width="724" height="724" viewBox="0 0 724 724" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">prisma-airs-cursor-hooks icon</title>
  <desc id="desc">A security shield scanning a cursor pointer glyph, in the Gruvbox palette.</desc>

  <defs>
    <linearGradient id="shieldStroke" x1="108" y1="110" x2="616" y2="614" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#8ec07c"/>
    </linearGradient>
  </defs>

  <g id="shield-hook-icon" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shield outline (security scanning). -->
    <path
      d="M362 96L560 172V342C560 466 478 566 362 628C246 566 164 466 164 342V172L362 96Z"
      fill="none"
      stroke="url(#shieldStroke)"
      stroke-width="34"/>

    <!-- Cursor pointer glyph, centered inside the shield. -->
    <path
      d="M298 246V470L352 418L390 494L426 476L388 400H458L298 246Z"
